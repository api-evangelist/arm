aid: arm
name: Arm
description: 'Arm Holdings plc (NASDAQ: ARM) is the semiconductor and software design
  company behind the energy-efficient Arm architecture that powers the majority of
  the world''s smartphones and billions of chips across mobile, automotive, IoT, edge
  AI, servers, and cloud. Arm licenses processor IP (Cortex, Neoverse, Ethos, Mali)
  and Compute Subsystems rather than manufacturing chips itself. For developers, Arm
  operates a developer hub, technical documentation, learning paths, community forums,
  and a large open-source GitHub organization (ARM-software) publishing firmware,
  compute libraries, and ML tooling. Arm does not currently expose a public REST API
  product; this profile catalogs its developer surface and web properties.'
